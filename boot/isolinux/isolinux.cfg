# ====================================================================
# GIRI OS 0.1 "Genesis" — ISOLINUX BIOS Bootloader Configuration
# Base: Debian 12 (Bookworm) amd64
# Founder: Abhinav Giri | Tagline: One System. Infinite Possibilities.
# ====================================================================

UI vesamenu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE Giri OS 0.1 Genesis (BIOS Live Boot)
MENU BACKGROUND /boot/grub/themes/giri/background.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 8
MENU TABMSGROW 16
MENU CMDLINEROW 16
MENU HELPMSGROW 18
MENU HELPMSGENDROW 22

# Giri OS Color Palette (Electric Blue, Cyan, Deep Space)
MENU COLOR border       30;44   #4000d2ff #00000000 std
MENU COLOR title        1;36;44 #ffffffff #00000000 std
MENU COLOR sel          7;37;40 #ffffffff #407928ca all
MENU COLOR unsel        37;44   #80ffffff #00000000 std
MENU COLOR help         37;40   #c0ffffff #00000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #ff00d2ff #00000000 std
MENU COLOR tabmsg       37;40   #60ffffff #00000000 std

# --------------------------------------------------------------------
# 1. Standard Live Session (Default)
# --------------------------------------------------------------------
LABEL live
    MENU LABEL ^1. Giri OS 0.1 (Genesis) — Standard Session
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components username=giri user-default-groups=sudo,audio,video,plugdev,netdev,games,cdrom,autologin hostname=giri-os quiet splash loglevel=3 udev.log_priority=3 vt.global_cursor_default=0

# --------------------------------------------------------------------
# 2. Safe Graphics Mode (Legacy Intel HD 2000 / VESA fallback)
# --------------------------------------------------------------------
LABEL classic
    MENU LABEL ^2. Giri OS 0.1 — Safe Graphics Mode (Intel HD 2000 / Legacy)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components username=giri user-default-groups=sudo,audio,video,plugdev,netdev,games,cdrom,autologin hostname=giri-os nomodeset vga=current giri.profile=classic plymouth.enable=0

# --------------------------------------------------------------------
# 3. System Recovery Shell
# --------------------------------------------------------------------
LABEL recovery
    MENU LABEL ^3. Giri OS 0.1 — System Recovery Mode (Emergency Shell)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components single systemd.unit=rescue.target

# --------------------------------------------------------------------
# 4. Memory Diagnostics
# --------------------------------------------------------------------
LABEL memtest
    MENU LABEL ^4. Memory Diagnostic (Memtest86+)
    LINUX /live/memtest86+.bin
