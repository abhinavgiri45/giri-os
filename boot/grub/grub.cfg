# ====================================================================
# GIRI OS 0.1 "Genesis" — GRUB 2 Master Configuration
# Base: Debian 12 (Bookworm) amd64
# Founder: Abhinav Giri | Tagline: One System. Infinite Possibilities.
# ====================================================================

set default="0"
set timeout=5

# Graphical Environment Setup
insmod font
insmod gfxterm
insmod png
insmod jpeg
insmod all_video

set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm

# Apply Giri OS Theme
if [ -e /boot/grub/themes/giri/theme.txt ]; then
    set theme=/boot/grub/themes/giri/theme.txt
elif [ -e ($root)/boot/grub/themes/giri/theme.txt ]; then
    set theme=($root)/boot/grub/themes/giri/theme.txt
fi

# Dynamic Kernel and Initrd Resolution
# Supports both canonical links (/live/vmlinuz) and versioned files (/live/vmlinuz-*)
if [ -f /live/vmlinuz ]; then
    set giri_kernel=/live/vmlinuz
else
    for k in /live/vmlinuz-*; do
        if [ -f "$k" ]; then
            set giri_kernel="$k"
            break
        fi
    done
fi

if [ -f /live/initrd.img ]; then
    set giri_initrd=/live/initrd.img
else
    for i in /live/initrd.img-*; do
        if [ -f "$i" ]; then
            set giri_initrd="$i"
            break
        fi
    done
fi

# --------------------------------------------------------------------
# 1. Normal Giri OS Live / Installed Session
# --------------------------------------------------------------------
menuentry "Giri OS 0.1 (Genesis) — Standard Session" --class giri --class os {
    linux ${giri_kernel} boot=live components username=giri user-default-groups=sudo,audio,video,plugdev,netdev,games,cdrom,autologin hostname=giri-os quiet splash loglevel=3 udev.log_priority=3 vt.global_cursor_default=0
    initrd ${giri_initrd}
}

# --------------------------------------------------------------------
# 2. Giri Classic / Safe Graphics (Intel HD 2000 / Legacy Graphics)
# --------------------------------------------------------------------
menuentry "Giri OS 0.1 — Safe Graphics Mode (Intel HD 2000 / Legacy)" --class giri-safe --class os {
    linux ${giri_kernel} boot=live components username=giri user-default-groups=sudo,audio,video,plugdev,netdev,games,cdrom,autologin hostname=giri-os nomodeset vga=current giri.profile=classic plymouth.enable=0
    initrd ${giri_initrd}
}

# --------------------------------------------------------------------
# 3. Giri OS Recovery & Diagnostics
# --------------------------------------------------------------------
menuentry "Giri OS 0.1 — System Recovery Mode (Emergency Shell)" --class recovery --class os {
    linux ${giri_kernel} boot=live components single systemd.unit=rescue.target
    initrd ${giri_initrd}
}

# --------------------------------------------------------------------
# 4. Memory Diagnostic Test
# --------------------------------------------------------------------
if [ -e /live/memtest86+.bin ]; then
    menuentry "Run Memory Diagnostic (Memtest86+)" --class memtest {
        linux16 /live/memtest86+.bin
    }
elif [ -e /live/memtest ]; then
    menuentry "Run Memory Diagnostic (Memtest86+)" --class memtest {
        linux16 /live/memtest
    }
fi

# --------------------------------------------------------------------
# 5. UEFI Firmware Settings
# --------------------------------------------------------------------
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --class efi {
        fwsetup
    }
fi
