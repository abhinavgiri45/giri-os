# ====================================================================
# Calamares Bootloader Module Configuration for Giri OS
# Installs GRUB EFI / BIOS bootloader to target disk
# ====================================================================
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/vmlinuz"
fallbackImg: "/initrd.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
efiBootMgr: "efibootmgr"
installEpilogue: true
