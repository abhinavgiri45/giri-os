# ====================================================================
# Calamares Users Module Configuration for Giri OS
# ====================================================================
---
defaultGroups:
    - sudo
    - audio
    - video
    - netdev
    - plugdev
    - users
    - cdrom
    - games

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
