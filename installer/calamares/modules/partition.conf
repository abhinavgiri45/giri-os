# ====================================================================
# Calamares Partition Module Configuration for Giri OS
# ====================================================================
---
userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
