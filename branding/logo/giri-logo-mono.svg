<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <!-- Monochrome Giri OS Logo (High contrast white-on-dark or black-on-light) -->
  <style>
    .mono-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 78px;
      letter-spacing: 6px;
      fill: #FFFFFF;
    }
    .mono-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 8px;
      fill: #A0AEC0;
    }
  </style>

  <rect width="900" height="320" rx="16" fill="#000000" />

  <g transform="translate(40, 20)">
    <!-- Orbital Ring -->
    <g transform="rotate(-28 140 140)">
      <ellipse cx="140" cy="140" rx="120" ry="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="240 20 40 12" />
      <circle cx="260" cy="140" r="5" fill="#FFFFFF" />
    </g>

    <!-- Geometric G -->
    <path d="M 210,105 
             C 192,68 152,48 112,54 
             C 65,61 32,103 32,150 
             C 32,201 70,238 124,238 
             C 178,238 216,202 216,155 
             L 216,142 
             L 126,142 
             L 126,168 
             L 186,168 
             C 183,188 158,210 124,210 
             C 86,210 59,182 59,147 
             C 59,112 84,83 121,79 
             C 148,76 174,88 188,110 
             Z" 
          fill="#FFFFFF" />
  </g>

  <g transform="translate(340, 95)">
    <text x="0" y="65" class="mono-title">GIRI OS</text>
    <rect x="2" y="90" width="220" height="3" rx="1.5" fill="#FFFFFF" />
    <circle cx="228" cy="91.5" r="3" fill="#FFFFFF" />
    <text x="3" y="130" class="mono-tagline">ONE SYSTEM. INFINITE POSSIBILITIES.</text>
  </g>
</svg>
