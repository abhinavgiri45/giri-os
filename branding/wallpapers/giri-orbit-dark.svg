<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <!-- GIRI OS — Minimalist Dark Wallpaper (Four-Pane Geometric Identity) -->
  <defs>
    <radialGradient id="minimalDarkAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="60%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#04070E" />
    </radialGradient>
  </defs>

  <!-- Deep Navy Base Canvas -->
  <rect width="3840" height="2160" fill="url(#minimalDarkAura)" />

  <!-- Center Symmetrical Four-Pane Window Symbol (320x320) -->
  <g transform="translate(1760, 920)">
    <!-- Top-Left: Electric Cyan-Blue -->
    <rect x="0" y="0" width="144" height="144" rx="22" fill="#00D2FF" opacity="0.95" />

    <!-- Top-Right: Vivid Electric Blue -->
    <rect x="176" y="0" width="144" height="144" rx="22" fill="#0066FF" opacity="0.95" />

    <!-- Bottom-Left: Electric Violet -->
    <rect x="0" y="176" width="144" height="144" rx="22" fill="#7928CA" opacity="0.95" />

    <!-- Bottom-Right: Radiant Violet-Magenta -->
    <rect x="176" y="176" width="144" height="144" rx="22" fill="#A855F7" opacity="0.95" />
  </g>

  <!-- Clean Wordmark & Tagline -->
  <g transform="translate(1920, 1340)" text-anchor="middle">
    <text font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#FFFFFF">
      GIRI <tspan fill="#00D2FF">OS</tspan>
    </text>
    <text y="54" font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="9" fill="#64748B">
      ONE SYSTEM. INFINITE POSSIBILITIES.
    </text>
  </g>
</svg>
