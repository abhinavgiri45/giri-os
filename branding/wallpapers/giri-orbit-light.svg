<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <radialGradient id="lightAura" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#E8EEF8" />
      <stop offset="45%" stop-color="#DBE5F2" />
      <stop offset="85%" stop-color="#CCD9EA" />
      <stop offset="100%" stop-color="#B8C8DF" />
    </radialGradient>

    <linearGradient id="lightOrbit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7B2CBF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lightOrbit2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#5A189A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2B7FFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Light Theme Minimalist Canvas -->
  <rect width="3840" height="2160" fill="url(#lightAura)" />

  <!-- Orbital Rings in Bright Crisp Geometry -->
  <g transform="translate(1920, 1040)">
    <!-- Distant Orbit -->
    <ellipse cx="0" cy="0" rx="1450" ry="580" fill="none" stroke="url(#lightOrbit1)" stroke-width="1.5" stroke-dasharray="10 20" transform="rotate(-18)" opacity="0.4" />

    <!-- Main Orbit -->
    <ellipse cx="0" cy="0" rx="1080" ry="420" fill="none" stroke="url(#lightOrbit2)" stroke-width="2.8" stroke-dasharray="500 25 150 15" transform="rotate(-25)" opacity="0.75" />
    <g transform="rotate(-25)">
      <circle cx="1080" cy="0" r="7" fill="#0077FF" filter="url(#softGlowLight)" />
      <circle cx="1080" cy="0" r="3" fill="#FFFFFF" />
      <circle cx="-1080" cy="0" r="5" fill="#7928CA" />
    </g>

    <!-- Inner Orbit -->
    <ellipse cx="0" cy="0" rx="680" ry="260" fill="none" stroke="url(#lightOrbit1)" stroke-width="3" transform="rotate(-32)" opacity="0.8" />
    <g transform="rotate(-32)">
      <circle cx="680" cy="0" r="5.5" fill="#00A8FF" filter="url(#softGlowLight)" />
    </g>

    <!-- Center Giri Core Symbol -->
    <g transform="scale(1.8) translate(-140, -140)" opacity="0.9">
      <path d="M 205,108 
               C 188,74 152,56 116,61 
               C 74,67 46,101 46,140 
               C 46,182 77,213 121,213 
               C 165,213 196,183 196,144 
               L 196,133 
               L 122,133 
               L 122,154 
               L 171,154 
               C 168,170 148,188 121,188 
               C 90,188 69,165 69,137 
               C 69,109 89,86 118,82 
               C 140,79 161,89 172,106 
               Z" 
            fill="#0066FF" />
      <path d="M 122,133 L 171,133 L 171,154 L 122,154 Z" fill="#7928CA" />
    </g>
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(1920, 2060)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="8" fill="#4A5568" opacity="0.8">GIRI OS  •  ONE SYSTEM. INFINITE POSSIBILITIES.</text>
  </g>
</svg>
