<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <!-- GIRI OS — Minimalist Light Wallpaper (Four-Pane Geometric Identity) -->
  <defs>
    <radialGradient id="minimalLightAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#EDF2F7" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#minimalLightAura)" />

  <!-- Center Symmetrical Four-Pane Window Symbol (320x320) -->
  <g transform="translate(1760, 920)">
    <!-- Top-Left: Electric Cyan-Blue -->
    <rect x="0" y="0" width="144" height="144" rx="22" fill="#00D2FF" />

    <!-- Top-Right: Vivid Electric Blue -->
    <rect x="176" y="0" width="144" height="144" rx="22" fill="#0066FF" />

    <!-- Bottom-Left: Electric Violet -->
    <rect x="0" y="176" width="144" height="144" rx="22" fill="#7928CA" />

    <!-- Bottom-Right: Radiant Violet-Magenta -->
    <rect x="176" y="176" width="144" height="144" rx="22" fill="#A855F7" />
  </g>

  <!-- Clean Wordmark & Tagline for Light Background -->
  <g transform="translate(1920, 1340)" text-anchor="middle">
    <text font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="8" fill="#0F172A">
      GIRI <tspan fill="#0066FF">OS</tspan>
    </text>
    <text y="54" font-family="'Inter', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="9" fill="#64748B">
      ONE SYSTEM. INFINITE POSSIBILITIES.
    </text>
  </g>
</svg>
