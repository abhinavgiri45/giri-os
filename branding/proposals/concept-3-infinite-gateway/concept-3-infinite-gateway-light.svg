<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <rect width="820" height="220" rx="16" fill="#FFFFFF" />
  <!-- Brand Symbol -->
  <g transform="translate(35, 10)">
    <g id="symbol-concept-3" >
      <defs>
        <linearGradient id="c3_f1_lt" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0284C7" />
          <stop offset="100%" stop-color="#0369A1" />
        </linearGradient>
        <linearGradient id="c3_f2_lt" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F46E5" />
          <stop offset="100%" stop-color="#4338CA" />
        </linearGradient>
        <linearGradient id="c3_f3_lt" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9333EA" />
          <stop offset="100%" stop-color="#7E22CE" />
        </linearGradient>
        </defs>
      <!-- Facet 1: Top Canopy (Cyan Horizon) -->
