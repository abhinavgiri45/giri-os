<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <rect width="820" height="220" rx="16" fill="#070913" />
  <!-- Brand Symbol -->
  <g transform="translate(35, 10)">
    <g id="symbol-concept-1" filter="url(#c1_glow)">
      <defs>
        <linearGradient id="c1_grad_a" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00F0FF" />
          <stop offset="60%" stop-color="#0080FF" />
          <stop offset="100%" stop-color="#0055FF" />
        </linearGradient>
        <linearGradient id="c1_grad_b" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#C084FC" />
          <stop offset="60%" stop-color="#9333EA" />
          <stop offset="100%" stop-color="#6B21A8" />
        </linearGradient>
        <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.3"/>
        </filter>
        </defs>
      <!-- Segment 1: Upper Spine & Canopy -->
      <path d="
    M 55,20 
    L 165,20 
    L 165,55 
    L 75,55 
    L 75,135 
    L 40,170 
    L 20,150 
    L 20,55 
    Z
    " fill="url(#c1_grad_a)" />
      <!-- Segment 2: Base & Locking Crossbar -->
      <path d="
    M 52,182 
    L 87,147 
    L 87,165 
    L 145,165 
    L 145,105 
    L 105,105 
    L 105,75 
    L 180,75 
    L 180,200 
    L 34,200 
    Z
    " fill="url(#c1_grad_b)" />
    </g>
  </g>
  <!-- Wordmark Section -->
  <g transform="translate(265, 30)">
    <!-- Main Title -->
    <text x="0" y="78" font-family="'Inter', 'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="76" letter-spacing="6">
      <tspan fill="#FFFFFF">GIRI</tspan>
      <tspan dx="14" fill="#00F0FF">OS</tspan>
    </text>
    <!-- Divider Bar -->
    <rect x="2" y="98" width="480" height="2.5" rx="1.2" fill="#00F0FF" />
    <!-- Tagline -->
    <text x="3" y="128" font-family="'Inter', 'Space Grotesk', -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#94A3B8">ONE SYSTEM. INFINITE POSSIBILITIES.</text>
  </g>
</svg>