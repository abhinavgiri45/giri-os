# ====================================================================
# GIRI OS — LIGHTDM GREETER CONFIGURATION
# ====================================================================
[greeter]
# Background Wallpaper
background = /usr/share/backgrounds/giri-orbit-dark.svg
theme-name = Giri-Dark
icon-theme-name = Giri-Icons
cursor-theme-name = Adwaita
font-name = DejaVu Sans 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = slight
xft-rgba = rgb

# Greeter Panel Widgets Layout
# ~host: Hostname / OS title
# ~spacer: Flexible spacer
# ~clock: Live digital time and date
# ~power: Shutdown, Restart, Suspend, Hibernate
# ~a11y: Accessibility menu (High contrast, Large font, On-screen keyboard)
indicators = ~host;~spacer;~clock;~spacer;~a11y;~session;~power
clock-format = %A, %B %d  •  %H:%M

# Window Layout
user-background = false
active-monitor = 0
hide-user-image = false
default-user-image = /usr/share/pixmaps/giri-user-avatar.png
screensaver-timeout = 60

# Panel and Card Position (Centered Login Card)
position = 50%,center 50%,center
